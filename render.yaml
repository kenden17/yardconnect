# render.yaml — Render deployment blueprint
# Docs: https://render.com/docs/blueprint-spec
#
# Secret env vars (JWT_SECRET, ADMIN_CODE, APP_URL, SMTP_*)
# are set manually in the Render dashboard under Environment.
# Only non-secret values are defined here.

services:
  - type: web
    name: campus-hands
    runtime: node
    region: oregon
    plan: free

    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health

    disk:
      name: campus-hands-data
      mountPath: /data
      sizeGB: 1

    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DB_PATH
        value: /data/database.sqlite
      - key: UPLOAD_DIR
        value: /data/uploads
