<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Admin — Campus Hands</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/main.css" />
  <style>
    /* ── Login ── */
    .login-overlay {
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; padding: 24px; background: var(--bg-alt);
    }
    .login-card {
      background: var(--bg); border: 1.5px solid var(--border);
      border-radius: var(--radius-lg); padding: 48px 40px;
      width: 100%; max-width: 360px; box-shadow: var(--shadow); text-align: center;
    }
    .login-card__logo { font-family: var(--font-display); font-size: 2rem; margin-bottom: 4px; }
    .login-card__logo span { color: var(--accent); }
    .login-card__sub { color: var(--dim); font-size: .82rem; margin-bottom: 32px; letter-spacing: .05em; text-transform: uppercase; }
    .login-code-input {
      width: 100%; padding: 14px; border: 1.5px solid var(--border); border-radius: var(--radius);
      background: var(--bg-alt); color: var(--text); font-size: 1.1rem; text-align: center;
      letter-spacing: .15em; box-sizing: border-box; margin-bottom: 12px; transition: border-color .2s;
    }
    .login-code-input:focus { outline: none; border-color: var(--accent); }
    .login-error { color: var(--danger); font-size: .82rem; min-height: 18px; margin-bottom: 12px; }

    /* ── Dashboard shell ── */
    .admin-wrap { max-width: 1300px; margin: 0 auto; padding: 100px var(--pad-x) 60px; }
    .admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 32px; flex-wrap: wrap; gap: 16px; }
    .admin-title { font-family: var(--font-display); font-size: clamp(2rem,5vw,3.2rem); }
    .admin-title span { color: var(--accent); }

    /* ── Stats ── */
    .stat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px,1fr)); gap: 14px; margin-bottom: 40px; }
    .stat-card { background: var(--bg); border: 1.5px solid var(--border); border-radius: var(--radius-lg); padding: 18px 20px; box-shadow: var(--shadow); }
    .stat-card__num { font-family: var(--font-display); font-size: 2.2rem; color: var(--accent); line-height: 1; }
    .stat-card__label { font-size: .72rem; text-transform: uppercase; letter-spacing: .1em; color: var(--dim); margin-top: 4px; }

    /* ── Tabs ── */
    .tab-bar { display: flex; gap: 4px; margin-bottom: 24px; border-bottom: 1.5px solid var(--border); flex-wrap: wrap; }
    .tab-btn {
      padding: 10px 20px; font-size: .82rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
      color: var(--dim); border-bottom: 3px solid transparent; transition: all .15s; margin-bottom: -2px; background: none;
    }
    .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }
    .tab-btn:hover  { color: var(--text); }
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    /* ── Table ── */
    .search-bar {
      width: 100%; padding: 9px 14px; border: 1.5px solid var(--border); border-radius: var(--radius);
      background: var(--bg); color: var(--text); font-size: .9rem; margin-bottom: 14px; box-sizing: border-box;
    }
    .search-bar:focus { outline: none; border-color: var(--accent); }
    .table-wrap { overflow-x: auto; background: var(--bg); border: 1.5px solid var(--border); border-radius: var(--radius-lg); box-shadow: var(--shadow); }
    .admin-table { width: 100%; border-collapse: collapse; font-size: .875rem; }
    .admin-table th {
      text-align: left; padding: 10px 12px; font-size: .7rem; font-weight: 700;
      letter-spacing: .1em; text-transform: uppercase; color: var(--dim);
      border-bottom: 1.5px solid var(--border); background: var(--bg-alt);
    }
    .admin-table td { padding: 11px 12px; border-bottom: 1px solid var(--border); color: var(--text); vertical-align: middle; }
    .admin-table tr:last-child td { border-bottom: none; }
    .admin-table tr:hover td { background: var(--accent-l); }

    /* ── Badges ── */
    .badge { display: inline-block; padding: 2px 9px; border-radius: 20px; font-size: .68rem; font-weight: 700; text-transform: uppercase; border: 1px solid; }
    .badge-open           { background: var(--success-l); color: var(--success); border-color: #bbf7d0; }
    .badge-assigned,
    .badge-active         { background: var(--blue-l);    color: var(--blue);    border-color: #bfdbfe; }
    .badge-pending_review { background: #fef3c7;          color: #92400e;        border-color: #fde68a; }
    .badge-completed      { background: var(--warn-l);    color: var(--warn);    border-color: #fde68a; }
    .badge-cancelled      { background: var(--danger-l);  color: var(--danger);  border-color: #fecaca; }

    .btn-gap { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
    .btn-suspend  { background: #b45309; color: #fff; border: none; }
    .btn-unsuspend { background: var(--success); color: #fff; border: none; }
  </style>
</head>
<body>

  <!-- ── Login ── -->
  <div id="loginScreen" class="login-overlay">
    <div class="login-card">
      <div class="login-card__logo">Campus<span>Hands</span></div>
      <div class="login-card__sub">Admin Panel</div>
      <input
        type="password"
        id="codeInput"
        class="login-code-input"
        placeholder="Enter admin code"
        autocomplete="current-password"
        autofocus
      />
      <div class="login-error" id="loginError"></div>
      <button class="btn btn--accent" id="loginBtn" style="width:100%;padding:12px">Enter →</button>
    </div>
  </div>

  <!-- ── Dashboard ── -->
  <div id="dashboard" style="display:none">
    <header class="nav">
      <a href="/" class="nav__logo">Campus<span>Hands</span></a>
      <span style="font-size:.75rem;letter-spacing:.15em;text-transform:uppercase;color:var(--accent)">Admin</span>
      <button class="btn btn--outline btn--sm" id="logoutBtn">Exit</button>
    </header>

    <div class="admin-wrap">
      <div class="admin-header">
        <h1 class="admin-title">Admin <span>Dashboard</span></h1>
        <span id="lastRefresh" style="font-size:.75rem;color:var(--dim)"></span>
      </div>

      <!-- Stats -->
      <div class="stat-grid" id="statGrid">
        <div class="stat-card"><div class="stat-card__num">…</div><div class="stat-card__label">Loading</div></div>
      </div>

      <!-- Tabs -->
      <div class="tab-bar">
        <button class="tab-btn active" data-tab="students">Students</button>
        <button class="tab-btn" data-tab="tasks">Tasks</button>
        <button class="tab-btn" data-tab="ratings">Ratings</button>
      </div>

      <!-- Students -->
      <div class="tab-panel active" id="tab-students">
        <input class="search-bar" type="text" placeholder="Search students…" data-search="usersBody" />
        <div class="table-wrap">
          <table class="admin-table">
            <thead><tr>
              <th>Name</th><th>Email</th><th>Rating</th>
              <th>Applications</th><th>Completed</th><th>Joined</th><th></th>
            </tr></thead>
            <tbody id="usersBody"><tr><td colspan="7" style="padding:20px;text-align:center;color:var(--dim)">Loading…</td></tr></tbody>
          </table>
        </div>
      </div>

      <!-- Tasks -->
      <div class="tab-panel" id="tab-tasks">
        <input class="search-bar" type="text" placeholder="Search tasks…" data-search="tasksBody" />
        <div class="table-wrap">
          <table class="admin-table">
            <thead><tr>
              <th>Title</th><th>Category</th><th>Pay</th><th>Payment</th>
              <th>City</th><th>Status</th><th>Poster</th><th>ID Info</th><th>Apps</th><th>Date</th><th></th>
            </tr></thead>
            <tbody id="tasksBody"><tr><td colspan="11" style="padding:20px;text-align:center;color:var(--dim)">Loading…</td></tr></tbody>
          </table>
        </div>
      </div>

      <!-- Ratings -->
      <div class="tab-panel" id="tab-ratings">
        <input class="search-bar" type="text" placeholder="Search ratings…" data-search="ratingsBody" />
        <div class="table-wrap">
          <table class="admin-table">
            <thead><tr>
              <th>Task</th><th>Student</th><th>Rated By</th><th>Stars</th><th>Comment</th><th>Date</th>
            </tr></thead>
            <tbody id="ratingsBody"><tr><td colspan="6" style="padding:20px;text-align:center;color:var(--dim)">Loading…</td></tr></tbody>
          </table>
        </div>
      </div>

    </div>
  </div>

  <script>
    // ── Helpers ──────────────────────────────────────────────
    let adminToken = sessionStorage.getItem('ch_admin_token');

    function esc(s) {
      return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }
    function fmt(d) {
      return d ? new Date(d).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}) : '—';
    }

    function toast(msg, type = 'success') {
      let wrap = document.getElementById('_toast_wrap');
      if (!wrap) {
        wrap = document.createElement('div');
        wrap.id = '_toast_wrap';
        wrap.style.cssText = 'position:fixed;bottom:24px;right:24px;z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none;max-width:300px';
        document.body.appendChild(wrap);
      }
      const el  = document.createElement('div');
      const isE = type === 'error';
      el.style.cssText = `background:${isE?'#fef2f2':'#f0fdf4'};border:1.5px solid ${isE?'#fecaca':'#bbf7d0'};color:${isE?'#b91c1c':'#15803d'};padding:11px 15px;border-radius:10px;font-size:.85rem;font-weight:500;box-shadow:0 4px 16px rgba(0,0,0,.1);pointer-events:all;opacity:0;transform:translateY(6px);transition:opacity .25s,transform .25s`;
      el.textContent = msg;
      wrap.appendChild(el);
      requestAnimationFrame(() => { el.style.opacity='1'; el.style.transform='translateY(0)'; });
      setTimeout(() => { el.style.opacity='0'; el.style.transform='translateY(6px)'; setTimeout(() => el.remove(), 280); }, 3500);
    }

    async function api(path, method = 'GET', body) {
      const opts = { method, headers: { 'x-admin-secret': adminToken, 'Content-Type': 'application/json' } };
      if (body !== undefined) opts.body = JSON.stringify(body);
      const r = await fetch('/api/admin' + path, opts);
      const d = await r.json();
      if (r.status === 401) { logout(); throw new Error('Unauthorized'); }
      if (!r.ok) throw new Error(d.error || 'Error');
      return d;
    }

    // ── Auth ─────────────────────────────────────────────────
    function showDashboard() {
      document.getElementById('loginScreen').style.display = 'none';
      document.getElementById('dashboard').style.display   = 'block';
    }
    function logout() {
      sessionStorage.removeItem('ch_admin_token');
      adminToken = null;
      document.getElementById('loginScreen').style.display = 'flex';
      document.getElementById('dashboard').style.display   = 'none';
      document.getElementById('loginError').textContent    = '';
      document.getElementById('codeInput').value           = '';
    }

    async function handleLogin() {
      const code  = document.getElementById('codeInput').value.trim();
      const errEl = document.getElementById('loginError');
      const btn   = document.getElementById('loginBtn');
      errEl.textContent = '';
      if (!code) { errEl.textContent = 'Enter the admin code.'; return; }

      btn.disabled = true; btn.textContent = 'Checking…';
      try {
        const data = await fetch('/api/admin/login', {
          method:  'POST',
          headers: { 'Content-Type': 'application/json' },
          body:    JSON.stringify({ code }),
        });
        const json = await data.json();
        if (!data.ok) { errEl.textContent = json.error || 'Invalid code.'; return; }
        adminToken = json.token;
        sessionStorage.setItem('ch_admin_token', adminToken);
        showDashboard();
        loadAll();
      } catch {
        errEl.textContent = 'Network error. Try again.';
      } finally {
        btn.disabled = false; btn.textContent = 'Enter →';
      }
    }

    document.getElementById('loginBtn').addEventListener('click', handleLogin);
    document.getElementById('codeInput').addEventListener('keydown', e => {
      if (e.key === 'Enter') handleLogin();
    });
    document.getElementById('logoutBtn').addEventListener('click', logout);

    // ── Stats ────────────────────────────────────────────────
    function renderStats(s) {
      document.getElementById('statGrid').innerHTML = `
        <div class="stat-card"><div class="stat-card__num">${s.totalUsers}</div><div class="stat-card__label">Students</div></div>
        <div class="stat-card"><div class="stat-card__num">${s.totalTasks}</div><div class="stat-card__label">Total Tasks</div></div>
        <div class="stat-card"><div class="stat-card__num">${s.openTasks}</div><div class="stat-card__label">Open</div></div>
        <div class="stat-card"><div class="stat-card__num">${s.activeTasks}</div><div class="stat-card__label">In Progress</div></div>
        <div class="stat-card"><div class="stat-card__num">${s.completedTasks}</div><div class="stat-card__label">Completed</div></div>
        <div class="stat-card"><div class="stat-card__num">${s.totalApps}</div><div class="stat-card__label">Applications</div></div>
        <div class="stat-card"><div class="stat-card__num">${s.cashJobs}</div><div class="stat-card__label">💵 Cash Jobs</div></div>
        <div class="stat-card"><div class="stat-card__num">${s.checkJobs}</div><div class="stat-card__label">📝 Check Jobs</div></div>
        <div class="stat-card"><div class="stat-card__num">$${Number(s.totalPay).toFixed(2)}</div><div class="stat-card__label">Total Paid Out</div></div>
      `;
      document.getElementById('lastRefresh').textContent = 'Updated ' + new Date().toLocaleTimeString();
    }

    // ── Students ─────────────────────────────────────────────
    async function loadUsers() {
      const { users } = await api('/users');
      const tbody = document.getElementById('usersBody');
      if (!users.length) {
        tbody.innerHTML = '<tr><td colspan="7" style="padding:20px;text-align:center;color:var(--dim)">No students yet.</td></tr>';
        return;
      }
      tbody.innerHTML = users.map(u => `
        <tr>
          <td><strong>${esc(u.name)}</strong>${u.suspended ? ' <span title="Suspended" style="color:var(--danger)">⛔</span>' : ''}</td>
          <td style="color:var(--text-mid);font-size:.85rem">${esc(u.email)}</td>
          <td style="color:#d97706">${u.avg_rating ? '★ ' + u.avg_rating + ' (' + u.rating_count + ')' : '—'}</td>
          <td>${u.app_count}</td>
          <td>${u.jobs_completed}</td>
          <td style="color:var(--dim);font-size:.82rem">${fmt(u.created_at)}</td>
          <td>
            <div class="btn-gap">
              ${u.suspended
                ? `<button class="btn btn--sm btn-unsuspend unsuspend-btn" data-id="${esc(u.id)}">Unsuspend</button>`
                : `<button class="btn btn--sm btn-suspend suspend-btn" data-id="${esc(u.id)}" data-name="${esc(u.name)}">Suspend</button>`
              }
              <button class="btn btn--danger btn--sm del-user-btn" data-id="${esc(u.id)}" data-name="${esc(u.name)}">Delete</button>
            </div>
          </td>
        </tr>`).join('');

      tbody.querySelectorAll('.suspend-btn').forEach(btn => {
        btn.addEventListener('click', async () => {
          if (!confirm(`Suspend "${btn.dataset.name}"?`)) return;
          try { await api('/users/' + btn.dataset.id + '/suspend', 'PATCH'); toast('User suspended.'); loadUsers(); }
          catch (e) { toast(e.message, 'error'); }
        });
      });
      tbody.querySelectorAll('.unsuspend-btn').forEach(btn => {
        btn.addEventListener('click', async () => {
          try { await api('/users/' + btn.dataset.id + '/unsuspend', 'PATCH'); toast('User unsuspended.'); loadUsers(); }
          catch (e) { toast(e.message, 'error'); }
        });
      });
      tbody.querySelectorAll('.del-user-btn').forEach(btn => {
        btn.addEventListener('click', async () => {
          if (!confirm(`Permanently delete "${btn.dataset.name}"? This cannot be undone.`)) return;
          try { await api('/users/' + btn.dataset.id, 'DELETE'); toast('User deleted.'); loadUsers(); loadStats(); }
          catch (e) { toast(e.message, 'error'); }
        });
      });
    }

    // ── Tasks ────────────────────────────────────────────────
    async function loadTasks() {
      const { tasks } = await api('/tasks');
      const tbody = document.getElementById('tasksBody');
      if (!tasks.length) {
        tbody.innerHTML = '<tr><td colspan="11" style="padding:20px;text-align:center;color:var(--dim)">No tasks yet.</td></tr>';
        return;
      }
      tbody.innerHTML = tasks.map(t => `
        <tr>
          <td><strong>${esc(t.title)}</strong>${t.flagged ? ' <span title="${esc(t.flag_reason||'flagged')}" style="color:var(--danger)">🚩</span>' : ''}</td>
          <td style="font-size:.82rem;color:var(--text-mid)">${esc(t.category)}</td>
          <td style="color:var(--accent);font-weight:700">$${Number(t.pay).toFixed(2)}</td>
          <td style="font-size:.82rem">${t.payment_method === 'check' ? '📝 Check' : '💵 Cash'}</td>
          <td style="font-size:.82rem;color:var(--text-mid)">${esc(t.city)}, ${esc(t.state)}</td>
          <td><span class="badge badge-${esc(t.status)}">${esc(t.status.replace('_',' '))}</span></td>
          <td style="font-size:.8rem">
            <strong>${esc(t.poster_name)}</strong><br/>
            <span style="color:var(--text-mid)">${esc(t.poster_email)}</span><br/>
            <span style="color:var(--dim)">${esc(t.poster_phone||'')}</span>
          </td>
          <td style="font-size:.78rem;color:var(--text-mid)">
            ${esc(t.poster_id_type||'')} · ${esc(t.poster_id_num||'')}<br/>
            DOB: ${esc(t.poster_dob||'')}<br/>
            ${esc(t.poster_address||'')}
            ${t.poster_id_photo
              ? `<br/><button class="btn btn--outline btn--sm view-id-btn" data-file="${esc(t.poster_id_photo)}" style="margin-top:4px;font-size:.7rem">View ID ↗</button>`
              : '<br/><span style="color:var(--danger)">No photo</span>'}
          </td>
          <td>${t.app_count}</td>
          <td style="font-size:.8rem;color:var(--dim)">${fmt(t.created_at)}</td>
          <td>
            <div class="btn-gap">
              ${t.flagged
                ? `<button class="btn btn--outline btn--sm unflag-btn" data-id="${esc(t.id)}">Unflag</button>`
                : `<button class="btn btn--sm flag-btn" data-id="${esc(t.id)}" style="background:#92400e;color:#fff;border:none">Flag</button>`
              }
              <button class="btn btn--danger btn--sm del-task-btn" data-id="${esc(t.id)}" data-title="${esc(t.title)}">Delete</button>
            </div>
          </td>
        </tr>`).join('');

      tbody.querySelectorAll('.flag-btn').forEach(btn => {
        btn.addEventListener('click', async () => {
          const reason = prompt('Flag reason (optional):');
          if (reason === null) return;
          try { await api('/jobs/' + btn.dataset.id + '/flag', 'PATCH', { reason }); toast('Task flagged.'); loadTasks(); }
          catch (e) { toast(e.message, 'error'); }
        });
      });
      tbody.querySelectorAll('.unflag-btn').forEach(btn => {
        btn.addEventListener('click', async () => {
          try { await api('/jobs/' + btn.dataset.id + '/unflag', 'PATCH'); toast('Task unflagged.'); loadTasks(); }
          catch (e) { toast(e.message, 'error'); }
        });
      });
      tbody.querySelectorAll('.del-task-btn').forEach(btn => {
        btn.addEventListener('click', async () => {
          if (!confirm(`Delete task "${btn.dataset.title}"?`)) return;
          try { await api('/tasks/' + btn.dataset.id, 'DELETE'); toast('Task deleted.'); loadTasks(); loadStats(); }
          catch (e) { toast(e.message, 'error'); }
        });
      });
      tbody.querySelectorAll('.view-id-btn').forEach(btn => {
        btn.addEventListener('click', async () => {
          try {
            const res = await fetch('/api/admin/id-photo/' + encodeURIComponent(btn.dataset.file), {
              headers: { 'x-admin-secret': adminToken },
            });
            if (!res.ok) { toast('Could not load photo.', 'error'); return; }
            const blob = await res.blob();
            window.open(URL.createObjectURL(blob), '_blank');
          } catch { toast('Could not load photo.', 'error'); }
        });
      });
    }

    // ── Ratings ──────────────────────────────────────────────
    async function loadRatings() {
      const { ratings } = await api('/ratings');
      const tbody = document.getElementById('ratingsBody');
      if (!ratings.length) {
        tbody.innerHTML = '<tr><td colspan="6" style="padding:20px;text-align:center;color:var(--dim)">No ratings yet.</td></tr>';
        return;
      }
      tbody.innerHTML = ratings.map(r => `
        <tr>
          <td><strong>${esc(r.job_title)}</strong></td>
          <td>${esc(r.student_name)}</td>
          <td style="color:var(--text-mid)">${r.rated_by === 'poster' ? '👤 Poster' : '🎓 Student'}</td>
          <td style="color:#d97706">${'★'.repeat(r.stars)}${'☆'.repeat(5-r.stars)}</td>
          <td style="font-size:.85rem;color:var(--text-mid)">${esc(r.comment||'—')}</td>
          <td style="font-size:.8rem;color:var(--dim)">${fmt(r.created_at)}</td>
        </tr>`).join('');
    }

    // ── Stats loader ─────────────────────────────────────────
    async function loadStats() {
      try { renderStats(await api('/stats')); } catch (e) { if (e.message !== 'Unauthorized') toast(e.message, 'error'); }
    }

    // ── Search ───────────────────────────────────────────────
    document.querySelectorAll('.search-bar').forEach(input => {
      input.addEventListener('input', () => {
        const q     = input.value.toLowerCase();
        const tbody = document.getElementById(input.dataset.search);
        if (!tbody) return;
        Array.from(tbody.querySelectorAll('tr')).forEach(row => {
          row.style.display = row.textContent.toLowerCase().includes(q) ? '' : 'none';
        });
      });
    });

    // ── Tabs ─────────────────────────────────────────────────
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
        if (btn.dataset.tab === 'tasks')   loadTasks();
        if (btn.dataset.tab === 'ratings') loadRatings();
      });
    });

    // ── Boot ─────────────────────────────────────────────────
    async function loadAll() {
      try { await Promise.all([loadStats(), loadUsers(), loadTasks()]); }
      catch (e) { if (e.message !== 'Unauthorized') toast('Load error: ' + e.message, 'error'); }
    }

    if (adminToken) {
      showDashboard();
      loadAll();
    }
  </script>
</body>
</html>
